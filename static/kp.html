<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Загрузка</title>
<style>
:root{--bg:#f4f5f7;--ink:#1d2430;--muted:#5b6676;--btn:#1f6feb;--btn-ink:#fff;--card:#fff;--edge:#dde2ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--ink:#e8ebf0;--muted:#9aa4b2;--btn:#3b82f6;--btn-ink:#fff;--card:#1a1f26;--edge:#2a313b}}
:root[data-theme="dark"]{--bg:#111418;--ink:#e8ebf0;--muted:#9aa4b2;--btn:#3b82f6;--btn-ink:#fff;--card:#1a1f26;--edge:#2a313b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:20px}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);margin:0 0 18px;word-break:break-word}
a.dl{display:block;text-align:center;background:var(--btn);color:var(--btn-ink);text-decoration:none;
  font-weight:600;font-size:19px;padding:22px 16px;border-radius:14px;-webkit-touch-callout:default}
#list{display:flex;flex-direction:column;gap:10px}
#list a.dl{font-size:17px;padding:16px}
ol{padding-left:22px;margin:18px 0 0}
li{margin:6px 0}
.err{color:#d1453b}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <h1 id="name">Загрузка</h1>
    <p class="meta" id="label"></p>
    <a class="dl" id="dl" href="#" hidden>⬇ Скачать</a>
    <div id="list" hidden></div>
    <ol id="how" hidden>
      <li><b>Нажмите и удерживайте</b> синюю кнопку<span id="many" hidden> (каждую нужную серию)</span>.</li>
      <li>В меню выберите <b>«Загрузить файл по ссылке»</b>.</li>
      <li>Safari качает сам, в фоне: прогресс — на экране блокировки и под стрелкой в адресной строке.</li>
    </ol>
    <p class="err" id="err" hidden>Нет ссылки на файл. Запустите шорткат ещё раз.</p>
  </div>
</main>
<script>
(function () {
  var p = {};
  location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0) { try { p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
  });
  // убрать подписанную ссылку из адреса и истории вкладки
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  var ok = function (u) { return /^https?:\/\//i.test(u || ""); };
  var items = [];
  if (p.l) {
    p.l.split("\n").forEach(function (line) {
      var i = line.indexOf(" ");
      var u = i > 0 ? line.slice(0, i) : line, n = i > 0 ? line.slice(i + 1) : "";
      if (ok(u)) items.push({ u: u, n: n || u.split("/").pop().split("?")[0] });
    });
  } else if (ok(p.u)) {
    items.push({ u: p.u, n: p.n || "" });
  }
  if (!items.length) { document.getElementById("err").hidden = false; return; }
  if (p.t) document.getElementById("label").textContent = (p.l ? "" : "Разрешение: ") + p.t;
  if (items.length === 1 && !p.l) {
    var a = document.getElementById("dl");
    a.href = items[0].u;
    if (items[0].n) { a.setAttribute("download", items[0].n); a.textContent = "⬇ " + items[0].n; document.getElementById("name").textContent = items[0].n; }
    a.hidden = false;
  } else {
    var list = document.getElementById("list");
    items.forEach(function (it) {
      var b = document.createElement("a");
      b.className = "dl"; b.href = it.u; b.textContent = "⬇ " + it.n;
      list.appendChild(b);
    });
    list.hidden = false;
    document.getElementById("name").textContent = "Серий: " + items.length;
    document.getElementById("many").hidden = false;
  }
  document.getElementById("how").hidden = false;
})();
</script>
</body>
</html>
